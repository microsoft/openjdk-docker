# build.yml Build pipeline to build Microsoft's build of OpenJDK docker images. When running the pipeline
# replace "image-repository" value with the location of your docker images (e.g. hub.docker.io/...)
# replace the image tags as needed.

name: "$(Year:yyyy).$(Month).$(BuildID)"

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    exclude:
      - .devops
      - .github/workflows

pr: none

parameters:
  - name: organization
    type: string
  - name: feed
    type: string
  - name: az_package
    type: string
    displayName: "Oras package name"
  - name: dryrun
    displayName: "Execute a dry run?"
    type: boolean
    default: false
  - name: jobs
    type: object
    default:
      azurelinux_8:
        hasExistingImages: true
        distro: azurelinux
        version: 8
        package: temurin-8
        image: "image-repository"
        tag: "3.0"
      distroless_11:
        hasExistingImages: true
        distro: distroless
        version: 11
        package: msopenjdk-11
        installer_image: "image-repository"
        installer_tag: "3.0"
        base_image: "image-repository"
        base_tag: "3.0"
      ubuntu_17:
        hasExistingImages: true
        distro: ubuntu
        version: 17
        package: msopenjdk-17
        image: "image-repository"
        tag: "image-tag"
      azurelinux_21:
        hasExistingImages: true
        distro: azurelinux
        version: 21
        package: msopenjdk-21
        image: "image-repository"
        tag: "3.0"

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: JEG-windows2022-x64-release
        os: windows
    stages:
      - stage: build_internal
        displayName: Build Internal
        variables:
          ACR_NAME: msopenjdk
        jobs:
          - job: build_internal
            pool:
              name: JEG-ubuntu22.04-x64-release
              os: linux
            strategy:
              matrix: ${{ parameters.jobs }}
            steps:
              - template: /.devops/templates/prepare-annotation.yml@self
                parameters:
                  registry: $(INTERNAL_ACR_REGISTRY)
                  tag: $(version)-$(distro)

              - bash: |
                  REGISTRIES=$(INTERNAL_ACR_REGISTRY):$(version)-$(distro)
                  if [[ "$(distro)" == "azurelinux" ]]; then
                    REGISTRIES+=";$(INTERNAL_ACR_REGISTRY):$(version)-mariner"
                  fi
                  echo "##vso[task.setvariable variable=REGISTRIES]$REGISTRIES"
                displayName: Set REGISTRIES variable

              # TEMPORARY: collect QEMU/binfmt state of the build agent to diagnose the
              # arm64 emulated "libc-bin ... exit status 139" (SIGSEGV) failure. Remove
              # once the emulator is updated. Never fails the build (always()/exit 0).
              - task: AzureCLI@2
                displayName: "QEMU/binfmt diagnostics (temporary)"
                condition: always()
                inputs:
                  azureSubscription: "JEG-Infrastructure"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    set +e
                    echo "===== HOST ====="
                    uname -a
                    (source /etc/os-release && echo "OS: $PRETTY_NAME")
                    echo "===== binfmt_misc registrations (host kernel) ====="
                    ls -la /proc/sys/fs/binfmt_misc/ 2>/dev/null
                    for f in /proc/sys/fs/binfmt_misc/qemu-*; do
                      [ -e "$f" ] || continue
                      echo "-- $f --"; cat "$f"
                    done
                    echo "===== host qemu binaries + versions ====="
                    ls -la /usr/bin/qemu-*-static /usr/bin/qemu-*  2>/dev/null | grep -i qemu || echo "no qemu binaries in /usr/bin"
                    for b in /usr/bin/qemu-aarch64-static /usr/bin/qemu-aarch64; do
                      [ -x "$b" ] && { echo "-- $b --"; "$b" --version 2>/dev/null | head -2; }
                    done
                    echo "===== binfmt.d configs ====="
                    ls -la /etc/binfmt.d /usr/lib/binfmt.d 2>/dev/null
                    cat /etc/binfmt.d/* /usr/lib/binfmt.d/* 2>/dev/null
                    echo "===== installed qemu packages ====="
                    (rpm -qa 2>/dev/null | grep -i qemu) || (dpkg -l 2>/dev/null | grep -i qemu) || echo "none found"
                    echo "===== docker / buildx ====="
                    docker version --format 'server={{.Server.Version}}' 2>/dev/null
                    docker buildx version 2>/dev/null
                    echo "===== qemu bundled inside mirrored moby/buildkit image ====="
                    az acr login -n junipercontainerregistry >/dev/null 2>&1
                    docker run --rm --entrypoint sh junipercontainerregistry.azurecr.io/mirror/moby/buildkit -c '
                      ls -la /usr/bin/ 2>/dev/null | grep -i qemu || echo "no qemu bundled in buildkit image";
                      for b in /usr/bin/qemu-aarch64 /usr/bin/qemu-aarch64-static; do [ -x "$b" ] && { echo "-- $b --"; "$b" --version 2>/dev/null | head -1; }; done
                    ' 2>/dev/null || echo "could not inspect buildkit image"
                    echo "===== END DIAGNOSTICS ====="
                    exit 0

              # TEMPORARY: ensure a fixed QEMU aarch64 emulator is registered on the Ubuntu
              # 22.04 agent BEFORE the buildx builder is created, to fix the arm64
              # "libc-bin ... exit status 139" (SIGSEGV) segfault. Root cause: a QEMU ELF-loader
              # regression (bug #1913 / LP #2072564) present in QEMU 8.1.1..9.1.x that crashes
              # ldconfig.real when emulating aarch64. Ubuntu jammy ships qemu-user-static 6.2,
              # which PREDATES the regression and registers with the F (fix_binary) flag, so
              # buildkit defers to it. This step just ensures it is present/registered and
              # prints the state. Once proven, this moves to the agent image and is removed here.
              - task: AzureCLI@2
                displayName: "Ensure fixed QEMU (temporary validation)"
                condition: always()
                inputs:
                  azureSubscription: "JEG-Infrastructure"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"
                  inlineScript: |
                    set +e
                    if [[ "$(uname -m)" != "x86_64" ]]; then
                      echo "Host is $(uname -m), not x86_64 - nothing to emulate. Skipping."
                      exit 0
                    fi
                    echo "Host binfmt BEFORE:"
                    cat /proc/sys/fs/binfmt_misc/qemu-aarch64 2>/dev/null || echo "  (qemu-aarch64 not registered)"
                    # Best-effort: install/register qemu-user-static (6.2 on jammy). No-op if the
                    # agent image already bakes it. Repoint apt to the Azure Ubuntu mirror first,
                    # since agents cannot reach archive.ubuntu.com (same blackhole that broke the
                    # image builds); azure.archive.ubuntu.com is reachable from Azure agents.
                    sudo sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list 2>/dev/null
                    sudo apt-get update -qq 2>/dev/null
                    sudo apt-get install -y -qq qemu-user-static binfmt-support 2>/dev/null
                    sudo systemctl restart systemd-binfmt.service 2>/dev/null
                    echo "qemu-aarch64-static version:"
                    /usr/bin/qemu-aarch64-static --version 2>/dev/null | head -1 || echo "  (qemu-aarch64-static not found on host)"
                    echo "Host binfmt AFTER (expect a registration with flags containing F):"
                    cat /proc/sys/fs/binfmt_misc/qemu-aarch64 2>/dev/null || echo "  (qemu-aarch64 STILL not registered)"
                    exit 0

              - task: AzureCLI@2
                retryCountOnTaskFailure: 2
                inputs:
                  azureSubscription: "JEG-Infrastructure"
                  scriptType: "bash"
                  scriptLocation: "scriptPath"
                  scriptPath: $(Build.SourcesDirectory)/scripts/build-image.sh
                  ${{ if eq(parameters.dryrun, true) }}:
                    arguments: >
                      --image             $(image)
                      --tag               $(tag)
                      --package           $(package)
                      --distribution      $(distro)
                      --registries        $(REGISTRIES)
                      --installer-image   $(installer_image)
                      --installer-tag     $(installer_tag)
                      --base-image        $(base_image)
                      --base-tag          $(base_tag)
                      --dryrun
                  ${{ else }}:
                    arguments: >
                      --image             $(image)
                      --tag               $(tag)
                      --package           $(package)
                      --distribution      $(distro)
                      --registries        $(REGISTRIES)
                      --installer-image   $(installer_image)
                      --installer-tag     $(installer_tag)
                      --base-image        $(base_image)
                      --base-tag          $(base_tag)
                displayName: build container image

              - template: /.devops/templates/annotate-image.yml@self
                parameters:
                  registry: $(INTERNAL_ACR_REGISTRY)
                  organization: ${{ parameters.organization }}
                  feed: ${{ parameters.feed }}
                  package: ${{ parameters.az_package }}
                  dryrun: ${{ parameters.dryrun }}


      - stage: validate_and_publish
        displayName: "Validate & Publish"
        dependsOn: build_internal
        jobs:

          - job: wait_for_validation
            displayName: wait for validation
            pool: server
            steps:
              - task: ManualValidation@0
                timeoutInMinutes: 4320 # Three days
                inputs:
                  instructions: "please validate the build configuration, artifacts, tests, and resume"
                  onTimeout: "resume"

          - job: build_public
            dependsOn: wait_for_validation
            pool:
              name: JEG-ubuntu22.04-x64-release
              os: linux
            strategy:
              matrix: ${{ parameters.jobs }}
            variables:
              ACR_NAME: msopenjdk
            steps:
              - template: /.devops/templates/prepare-annotation.yml@self
                parameters:
                  registry: $(ACR_REGISTRY)
                  tag: $(version)-$(distro)

              - bash: |
                  REGISTRIES=$(ACR_REGISTRY):$(version)-$(distro)
                  if [[ "$(distro)" == "azurelinux" ]]; then
                    REGISTRIES+=";$(ACR_REGISTRY):$(version)-mariner"
                  fi
                  echo "##vso[task.setvariable variable=REGISTRIES]$REGISTRIES"
                displayName: Set REGISTRIES variable

              - task: AzureCLI@2
                retryCountOnTaskFailure: 2
                inputs:
                  azureSubscription: "JEG-Infrastructure"
                  scriptType: "bash"
                  scriptLocation: "scriptPath"
                  scriptPath: $(Build.SourcesDirectory)/scripts/build-image.sh
                  ${{ if eq(parameters.dryrun, true) }}:
                    arguments: >
                      --image             $(image)
                      --tag               $(tag)
                      --package           $(package)
                      --distribution      $(distro)
                      --registries        $(REGISTRIES)
                      --installer-image   $(installer_image)
                      --installer-tag     $(installer_tag)
                      --base-image        $(base_image)
                      --base-tag          $(base_tag)
                      --dryrun
                  ${{ else }}:
                    arguments: >
                      --image             $(image)
                      --tag               $(tag)
                      --package           $(package)
                      --distribution      $(distro)
                      --registries        $(REGISTRIES)
                      --installer-image   $(installer_image)
                      --installer-tag     $(installer_tag)
                      --base-image        $(base_image)
                      --base-tag          $(base_tag)
                displayName: build container image

              - template: /.devops/templates/annotate-image.yml@self
                parameters:
                  registry: $(ACR_REGISTRY)
                  organization: ${{ parameters.organization }}
                  feed: ${{ parameters.feed }}
                  package: ${{ parameters.az_package }}
                  dryrun: ${{ parameters.dryrun }}

              - task: PythonScript@0
                displayName: Set build tag
                condition: ne(${{ parameters.dryrun }}, true) # images are not built when running in dryrun mode.
                inputs:
                  scriptSource: 'inline'
                  script: |
                    # 15 is used since that will include sha prefix + eight digits of the hash value
                    tag = "$(containerImageDigest)"[:15]
                    tag = tag.replace(":", "_")

                    print(f"##vso[build.addbuildtag]{tag}")

              - ${{ if ne(parameters.dryrun, true) }}:
                - task: AzureCLI@2
                  displayName: Trigger signing
                  env:
                    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
                  inputs:
                    azureSubscription: "JEG-Infrastructure"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      az pipelines run \
                        --branch main \
                        --org ${{ parameters.organization }} \
                        --project $(OPENJDK_PROJECT) \
                        --id $(OPENJDK_SIGNING_ID) \
                        --parameters image_repository="$(ACR_REGISTRY)" \
                          reference="$(containerImageDigest)" \
                          reference_type="container_digest"
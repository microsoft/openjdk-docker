# build.yml Build pipeline to build Microsoft's build of OpenJDK docker images. When running the pipeline
# replace "image-repository" value with the location of your docker images (e.g. hub.docker.io/...)
# replace the image tags as needed.

name: "$(Year:yyyy).$(Month).$(BuildID)"

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    exclude:
      - .devops
      - .github/workflows

pr: none

parameters:
  - name: organization
    type: string
  - name: feed
    type: string
  - name: az_package
    type: string
    displayName: "Oras package name"
  - name: architectures
    type: object
    default:
      - x64
      - aarch64
  - name: jobs
    type: object
    default:
      azurelinux_8:
        hasExistingImages: true
        distro: azurelinux
        version: 8
        package: temurin-8
        image: "image-repository"
        tag: "3.0"
      distroless_11:
        hasExistingImages: true
        distro: distroless
        version: 11
        package: msopenjdk-11
        installer_image: "image-repository"
        installer_tag: "3.0"
        base_image: "image-repository"
        base_tag: "3.0"
      ubuntu_17:
        hasExistingImages: true
        distro: ubuntu
        version: 17
        package: msopenjdk-17
        image: "image-repository"
        tag: "image-tag"
      azurelinux_21:
        hasExistingImages: true
        distro: azurelinux
        version: 21
        package: msopenjdk-21
        image: "image-repository"
        tag: "3.0"

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: JEG-windows2022-x64-release
        os: windows
    stages:
      - stage: build_internal
        displayName: Build Internal
        variables:
          ACR_NAME: msopenjdk
        jobs:
          - job: build_internal
            displayName: Build Internal ($(architecture))
            pool:
              name: JEG-azurelinux-$(architecture)-release
              os: linux
            strategy:
              matrix:
                ${{ each job in parameters.jobs }}:
                  ${{ each arch in parameters.architectures }}:
                    ${{ job.key }}_${{ arch }}:
                      ${{ each pair in job.value }}:
                        ${{ pair.key }}: ${{ pair.value }}
                      architecture: ${{ arch }}
            steps:
              - template: /.devops/templates/prepare-annotation.yml@self
                parameters:
                  registry: $(INTERNAL_ACR_REGISTRY)
                  tag: $(version)-$(distro)

              - template: /.devops/templates/build-image.yml@self
                parameters:
                  acr_registry: $(INTERNAL_ACR_REGISTRY)
                  version: $(version)
                  distro: $(distro)

              - template: /.devops/templates/annotate-image.yml@self
                parameters:
                  registry: $(INTERNAL_ACR_REGISTRY)
                  organization: ${{ parameters.organization }}
                  feed: ${{ parameters.feed }}
                  package: ${{ parameters.az_package }}


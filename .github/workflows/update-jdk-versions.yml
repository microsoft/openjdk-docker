name: Update JDK Versions

on:
  schedule:
    # Tuesdays and Thursdays at 12:00 AM PT, so version-bump PRs land before the
    # automated Monday/Wednesday/Friday image builds. GitHub Actions cron is UTC
    # only and does not observe DST, so this is pinned to 08:00 UTC (midnight PST).
    - cron: "0 8 * * 2,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only prints the detected changes; create-pull-request opens/updates a PR"
        type: choice
        default: dry-run
        options:
          - dry-run
          - create-pull-request

permissions:
  contents: write
  pull-requests: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rewrites versions.json in place with the latest patch versions pulled from
      # the upstream sources (Microsoft download page for msopenjdk, Adoptium API
      # for temurin). No-op if everything is already current.
      - name: Update versions.json from upstream release sources
        run: ./scripts/update-versions.sh versions.json

      # Determine whether the script actually changed anything, and surface the
      # diff on the run's summary page so it is visible without opening logs.
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No JDK version changes detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Detected JDK version changes"
              echo '```diff'
              git --no-pager diff -- versions.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git --no-pager diff -- versions.json
          fi

      # Manual dry-run: changes were found but the user asked not to open a PR, so
      # just report what would have happened. Only reachable from workflow_dispatch.
      - name: Dry run (no pull request created)
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: echo "::notice title=Dry run::Changes detected but skipping pull request creation (mode=dry-run)."

      # Open (or refresh) the version-bump PR. Runs on every scheduled execution,
      # and on manual runs unless dry-run mode was selected.
      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="auto/update-jdk-versions"

          # Commit the updated versions.json as the bot on a dedicated branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reuse the same branch every run: -C resets it to the current commit so
          # an existing (stale) branch is force-updated with the latest versions.
          git switch -C "$branch"
          git add versions.json
          git commit -m "Update JDK versions from upstream release sources"
          git push -f origin "$branch"

          # Check if there is already an open PR for this branch. If none is open,
          # create one; if one already exists, the force-push above updated it, so
          # there is nothing more to do.
          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --head "$branch" \
              --base "${{ github.event.repository.default_branch }}" \
              --title "Update JDK versions" \
              --body "Automated update of \`versions.json\` from upstream release sources: [Microsoft Build of OpenJDK](https://learn.microsoft.com/en-us/java/openjdk/download) (msopenjdk) and the [Adoptium API](https://api.adoptium.net) (temurin). Generated by the \`Update JDK Versions\` workflow."
          fi

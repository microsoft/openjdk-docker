name: Validate Published Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_temurin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distros: ["azurelinux", "distroless"]
        jdkvendor: ["temurin"]
        jdkversion: [{ major: "8", expected: "1.8.0_472" }]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate container images
        run: |
          ./scripts/validate-image.sh \
            ${{ matrix.distros }} \
            ${{ matrix.jdkvendor }} \
            ${{ matrix.jdkversion.major }} \
            ${{ matrix.jdkversion.expected }}

  validate_msopenjdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distros: ["azurelinux", "distroless", "ubuntu"]
        jdkvendor: ["msopenjdk"]
        jdkversion:
          [
            { major: "11", expected: "11.0.31" },
            { major: "17", expected: "17.0.19" },
            { major: "21", expected: "21.0.11" },
            { major: "25", expected: "25.0.3" }
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate container images
        run: |
          ./scripts/validate-image.sh \
            ${{ matrix.distros }} \
            ${{ matrix.jdkvendor }} \
            ${{ matrix.jdkversion.major }} \
            ${{ matrix.jdkversion.expected }}

  validate_msopenjdk_aarch64:
    runs-on: ["self-hosted", "1ES.Pool=JEG-linux-arm64-openjdk-docker"]
    strategy:
      fail-fast: false
      matrix:
        distros: ["azurelinux", "distroless", "ubuntu"]
        jdkvendor: ["msopenjdk"]
        jdkversion:
          [
            { major: "11", expected: "11.0.31" },
            { major: "17", expected: "17.0.19" },
            { major: "21", expected: "21.0.11" },
            { major: "25", expected: "25.0.3" }
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate container images
        run: |
          ./scripts/validate-image.sh \
            ${{ matrix.distros }} \
            ${{ matrix.jdkvendor }} \
            ${{ matrix.jdkversion.major }} \
            ${{ matrix.jdkversion.expected }}

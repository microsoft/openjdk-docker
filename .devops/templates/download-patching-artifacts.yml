parameters:
  - name: organization
    type: string
  - name: feed
    type: string

steps:
  - template: /.devops/templates/download-artifact.yml@self
    parameters:
      organization: ${{ parameters.organization }}
      feed: ${{ parameters.feed }}
      package: trivy
      version: $(TRIVY_VERSION)

  - template: /.devops/templates/download-artifact.yml@self
    parameters:
      organization: ${{ parameters.organization }}
      feed: ${{ parameters.feed }}
      package: copa
      version: $(COPA_VERSION)

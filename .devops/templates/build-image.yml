parameters:
  - name: acr_registry
    type: string
  - name: version
    type: string
  - name: distro
    type: string

steps:

  - task: AzureCLI@2
    displayName: Azure CLI ACR login
    inputs:
      azureSubscription: "JEG-Infrastructure"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az acr login -n junipercontainerregistry
        az acr login -n "$(ACR_NAME)"

  - bash: |
      echo "DOTNET VERSION BEFORE INSTALL"
      dotnet --info
    displayName: Debug .NET version before install
    continueOnError: true

  - task: UseDotNet@2
    displayName: Install .NET 8 SDK
    inputs:
      packageType: sdk
      version: '8.x'
      includePreviewVersions: false
      installationPath: $(Agent.ToolsDirectory)/dotnet

  - bash: |
      echo "DOTNET VERSION AFTER INSTALL"
      dotnet --info
    displayName: Debug .NET version after install
    continueOnError: true

  - bash: |
      PRIMARY_IMAGE="${{ parameters.acr_registry }}:${{ parameters.version }}-${{ parameters.distro }}"
      REMOTE_IMAGES="$PRIMARY_IMAGE"

      if [[ "${{ parameters.distro }}" == "azurelinux" ]]; then
        REMOTE_IMAGES+=",${{ parameters.acr_registry }}:${{ parameters.version }}-mariner"
      fi
      
      echo "##vso[task.setvariable variable=PRIMARY_IMAGE]$PRIMARY_IMAGE"
      echo "##vso[task.setvariable variable=REMOTE_IMAGES]$REMOTE_IMAGES"
    displayName: Set image variables

  - bash: |
      if [[ "$(architecture)" == "x64" ]]; then
        BUILD_ARCH="amd64"
      else
        BUILD_ARCH="arm64"
      fi

      echo "Resolved build architecture: $BUILD_ARCH"
      echo "##vso[task.setvariable variable=BUILD_ARCH;isOutput=true]$BUILD_ARCH"
    displayName: Resolve build platform
    name: resolve_build_platform

  - task: 1ES.BuildContainerImage@1
    displayName: 1ES Build container for $(architecture)
    inputs:
      image: $(PRIMARY_IMAGE)
      dockerfile: docker/${{ parameters.distro }}/Dockerfile.msopenjdk-${{ parameters.version }}-jdk
      enableNetwork: true
      useBuildKit: true
      context: docker/${{ parameters.distro }}
      ${{ if eq(parameters.distro, 'distroless') }}:
        buildArguments: >
          --platform linux/$(resolve_build_platform.BUILD_ARCH)
          --build-arg INSTALLER_IMAGE=$(installer_image)
          --build-arg INSTALLER_TAG=$(installer_tag)
          --build-arg BASE_IMAGE=$(base_image)
          --build-arg BASE_TAG=$(base_tag)
          --build-arg package=$(package)
      ${{ else }}:
        buildArguments: >
          --platform linux/$(resolve_build_platform.BUILD_ARCH)
          --build-arg IMAGE=$(image)
          --build-arg TAG=$(tag)
          --build-arg package=$(package)

  - task: 1ES.PushContainerImage@1
    displayName: 1ES Push container
    inputs:
      image: $(PRIMARY_IMAGE)
      remoteImage: $(REMOTE_IMAGES)
parameters:
  - name: image
    type: string

steps:
  - bash: |
      trivy image \
        --vuln-type os \
        --ignore-unfixed \
        --exit-code 1 \
        --format json \
        --output "./trivy-report.json" \
        "${{ parameters.image }}"
      
      if [[ $? -eq 0 ]]; then
        RUN_COPA="false"
      elif [[ $STATUS -eq 1 ]]; then
        RUN_COPA="true"
      else
        RUN_COPA="false"
        echo "##vso[task.logissue type=error]Trivy scan failed"
      fi
      echo "##vso[task.setvariable variable=RUN_COPA]$RUN_COPA"
    displayName: Scan container image
    condition: succeeded()

  - bash: |
      REPORT_PATH="$(Pipeline.workspace)/trivy-report.json"
      if [[ -z "$REPORT_PATH" || ! -f "$REPORT_PATH" ]]; then
        echo "##vso[task.logissue type=error]No Trivy report was found at $REPORT_PATH"
        exit 1
      fi
    displayName: Verify trivy report
    condition: and(succeeded(), eq(variables['RUN_COPA'], 'true'))

  - bash: |
      copa patch \
        --image "${{ parameters.image }}" \
        --report "./trivy-report.json" \
        --tag "${{ parameters.image }}" \
        --push \
        --ignore-errors
    displayName: Run copa
    condition: and(succeeded(), eq(variables['RUN_COPA'], 'true'))
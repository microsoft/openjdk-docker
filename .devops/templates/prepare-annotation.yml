parameters:
  - name: registry
    type: string
  - name: tag
    type: string

steps:

  - task: AzureCLI@2
    displayName: Gather container image manifests
    condition: eq(variables['hasExistingImages'], 'true')
    inputs:
      azureSubscription: "JEG-Infrastructure"
      scriptType: "bash"
      scriptLocation: inlineScript
      inlineScript: |
        az acr login --name $(ACR_NAME)
        manifest=$(az acr manifest show ${{ parameters.registry }}:${{ parameters.tag }} -o json | jq -c .)
        echo "##vso[task.setvariable variable=manifest]$manifest"

  - task: PythonScript@0
    displayName: Output image digest variables
    condition: eq(variables['hasExistingImages'], 'true')
    env:
      MANIFEST: $(manifest)
    inputs:
      scriptSource: 'inline'
      script: |
        import json
        import os

        amd64_digest = ""
        arm64_digest = ""
        manifest = json.loads(os.environ.get('MANIFEST', '{}'))

        print("##[debug]PREPARE-ANNOTATION-DEBUG: manifest payload received")
        print(f"##vso[debug]PREPARE-ANNOTATION-DEBUG: manifest type={type(manifest).__name__}")
        print(f"##vso[debug]PREPARE-ANNOTATION-DEBUG: manifest keys={list(manifest.keys()) if isinstance(manifest, dict) else 'N/A'}")

        if not manifest:
            print("##vso[task.logissue type=error]Container image manifest is empty or null!")
            exit(1)

        descriptors = manifest.get('manifests', [])
        print(f"##vso[debug]PREPARE-ANNOTATION-DEBUG: descriptor count={len(descriptors)}")

        for index, descriptor in enumerate(descriptors):
            platform = descriptor.get('platform', {})
            architecture = platform.get('architecture', 'unknown')
            digest = descriptor.get('digest', 'missing')
            media_type = descriptor.get('mediaType', 'unknown')
            print(
                f"##vso[debug]PREPARE-ANNOTATION-DEBUG: descriptor[{index}] "
                f"arch={architecture} digest={digest} mediaType={media_type}"
            )

            if architecture == 'amd64':
                amd64_digest = digest
            elif architecture == 'arm64':
                arm64_digest = digest

        print(f"##vso[debug]PREPARE-ANNOTATION-DEBUG: resolved amd64_digest={amd64_digest}")
        print(f"##vso[debug]PREPARE-ANNOTATION-DEBUG: resolved arm64_digest={arm64_digest}")

        if not amd64_digest or not arm64_digest:
            print(f"##vso[task.logissue type=warning]Missing one of amd64_digest: {amd64_digest} or arm64_digest: {arm64_digest}.")

        print(f"##vso[task.setvariable variable=imageDigestAmd64]{amd64_digest}")
        print(f"##vso[task.setvariable variable=imageDigestArm64]{arm64_digest}")

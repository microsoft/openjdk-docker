name: Check Expected Versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      temurin: ${{ steps.load.outputs.temurin }}
      msopenjdk: ${{ steps.load.outputs.msopenjdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load versions from versions.json
        id: load
        run: |
          {
            echo "temurin=$(jq -c '.temurin | to_entries | map({major: .key, expected: .value})' versions.json)"
            echo "msopenjdk=$(jq -c '.msopenjdk | to_entries | map({major: .key, expected: .value})' versions.json)"
          } >> "$GITHUB_OUTPUT"

  validate_temurin:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distros: [ "azurelinux", "distroless" ]
        jdkvendor: [ "temurin" ]
        jdkversion: ${{ fromJson(needs.prepare.outputs.temurin) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image locally
        run: |
          docker build \
            -t mcr.microsoft.com/openjdk/jdk:${{ matrix.jdkversion.major }}-${{ matrix.distros }} \
            -f ./docker/${{ matrix.distros }}/Dockerfile.${{ matrix.jdkvendor }}-${{ matrix.jdkversion.major }}-jdk \
            ./docker

      - name: Validate container image
        run: |
          ./scripts/validate-image.sh \
            -s ${{ matrix.distros }} \
            ${{ matrix.jdkvendor }} \
            ${{ matrix.jdkversion.major }} \
            ${{ matrix.jdkversion.expected }}

  validate_msopenjdk:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distros: [ "azurelinux", "distroless", "ubuntu" ]
        jdkvendor: [ "msopenjdk" ]
        jdkversion: ${{ fromJson(needs.prepare.outputs.msopenjdk) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image locally
        run: |
          docker build \
            -t mcr.microsoft.com/openjdk/jdk:${{ matrix.jdkversion.major }}-${{ matrix.distros }} \
            -f ./docker/${{ matrix.distros }}/Dockerfile.${{ matrix.jdkvendor }}-${{ matrix.jdkversion.major }}-jdk \
            ./docker

      - name: Validate container image
        run: |
          ./scripts/validate-image.sh \
            -s ${{ matrix.distros }} \
            ${{ matrix.jdkvendor }} \
            ${{ matrix.jdkversion.major }} \
            ${{ matrix.jdkversion.expected }}

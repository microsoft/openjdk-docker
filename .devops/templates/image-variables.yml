# image-variables.yml
#
# Expands a single entry of the `jobs` matrix into job variables. Values that only some
# distributions use (installer/base images) default to "none" so the argument list passed to
# build-image.sh keeps a stable shape.
#
# Optional values use conditional insertion rather than `coalesce()`. Expression functions
# coerce their operands, which turns a tag such as '3.0' into the number 3.0 and emits it as
# "3". The values are also quoted so the generated YAML cannot re-parse them as numbers.
#
# required parameters:
#   job: object                    # A single value from the `jobs` matrix in build.yml.
#

parameters:
  - name: job
    type: object

variables:
  - name: ACR_NAME
    value: msopenjdk
  - name: hasExistingImages
    value: ${{ parameters.job.hasExistingImages }}
  - name: distro
    value: "${{ parameters.job.distro }}"
  - name: version
    value: "${{ parameters.job.version }}"
  - name: package
    value: "${{ parameters.job.package }}"
  - name: image
    ${{ if parameters.job.image }}:
      value: "${{ parameters.job.image }}"
    ${{ else }}:
      value: "none"
  - name: tag
    ${{ if parameters.job.tag }}:
      value: "${{ parameters.job.tag }}"
    ${{ else }}:
      value: "none"
  - name: installer_image
    ${{ if parameters.job.installer_image }}:
      value: "${{ parameters.job.installer_image }}"
    ${{ else }}:
      value: "none"
  - name: installer_tag
    ${{ if parameters.job.installer_tag }}:
      value: "${{ parameters.job.installer_tag }}"
    ${{ else }}:
      value: "none"
  - name: base_image
    ${{ if parameters.job.base_image }}:
      value: "${{ parameters.job.base_image }}"
    ${{ else }}:
      value: "none"
  - name: base_tag
    ${{ if parameters.job.base_tag }}:
      value: "${{ parameters.job.base_tag }}"
    ${{ else }}:
      value: "none"

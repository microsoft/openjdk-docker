parameters:
  - name: acr_registry
    type: string
  - name: version
    type: string
  - name: distro
    type: string

steps:
  - bash: |
      REGISTRIES="${{ parameters.acr_registry }}:${{ parameters.version }}-${{ parameters.distro }}"
      if [[ "${{ parameters.distro }}" == "azurelinux" ]]; then
        REGISTRIES+=";${{ parameters.acr_registry }}:${{ parameters.version }}-mariner"
      fi
      echo "##vso[task.setvariable variable=REGISTRIES]$REGISTRIES"
    displayName: Set REGISTRIES variable

  - task: 1ES.BuildContainerImage@1
    displayName: 1ES Build container
    inputs:
      image: $(REGISTRIES)
      dockerfile: docker/${{ parameters.distro }}/Dockerfile.msopenjdk-${{ parameters.version }}-jdk
      enableNetwork: true
      useBuildKit: true
      context: docker/${{ parameters.distro }}
      ${{ if eq(parameters.distro, 'distroless') }}:
        buildArguments: >
          --platform linux/amd64,linux/arm64
          --build-arg INSTALLER_IMAGE=$(installer_image)
          --build-arg INSTALLER_TAG=$(installer_tag)
          --build-arg BASE_IMAGE=$(base_image)
          --build-arg BASE_TAG=$(base_tag)
          --build-arg package=$(package)
      ${{ else }}:
        buildArguments: >
          --platform linux/amd64,linux/arm64
          --build-arg IMAGE=$(image)
          --build-arg TAG=$(tag)
          --build-arg package=$(package)

  - task: 1ES.PushContainerImage@1
    displayName: 1ES Push container
    inputs:
      image: $(REGISTRIES)
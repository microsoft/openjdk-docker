# build.yml Build pipeline to build Microsoft's build of OpenJDK docker images. When running the pipeline
# replace "image-repository" value with the location of your docker images (e.g. hub.docker.io/...)
# replace the image tags as needed.

name: "$(Year:yyyy).$(Month).$(BuildID)"

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    exclude:
      - .devops
      - .github/workflows

pr: none

parameters:
  - name: organization
    type: string
  - name: feed
    type: string
  - name: az_package
    type: string
    displayName: "Oras package name"
  - name: dryrun
    displayName: "Execute a dry run?"
    type: boolean
    default: false
  - name: jobs
    type: object
    default:
      azurelinux_8:
        hasExistingImages: true
        distro: azurelinux
        version: 8
        package: temurin-8
        image: "image-repository"
        image_tag: "3.0"
      distroless_11:
        hasExistingImages: true
        distro: distroless
        version: 11
        package: msopenjdk-11
        installer_image: "image-repository"
        installer_tag: "3.0"
        base_image: "image-repository"
        base_tag: "3.0"
      ubuntu_17:
        hasExistingImages: true
        distro: ubuntu
        version: 17
        package: msopenjdk-17
        image: "image-repository"
        image_tag: "image-tag"
      azurelinux_21:
        hasExistingImages: true
        distro: azurelinux
        version: 21
        package: msopenjdk-21
        image: "image-repository"
        image_tag: "3.0"

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: JEG-windows2022-x64-release
        os: windows
    stages:
      - stage: build_internal
        displayName: Build Internal
        jobs:
          # Rename the run after the images it actually builds, so the runs list reads
          # "2026.8.15012341 (azurelinux 8, distroless 11, ...)" instead of a bare number.
          # The matrix is fanned out into env vars because ${{ each }} cannot be used inside
          # a script body, only at a YAML node level such as a mapping key.
          - job: set_run_name
            displayName: Set run title
            pool:
              name: JEG-pipeline-support
              os: linux
            steps:
              - bash: |
                  set -euo pipefail
                  IMAGES=$(printenv | grep '^RUN_NAME_IMAGE_' | cut -d= -f2- | sort -u -V | paste -sd, - | sed 's/,/, /g') || true
                  BASE="${BUILD_BUILDNUMBER%% (*}"
                  if [[ -n "$IMAGES" ]]; then
                    echo "##vso[build.updatebuildnumber]$BASE ($IMAGES)"
                  fi
                displayName: Set run title
                env:
                  ${{ each entry in parameters.jobs }}:
                    RUN_NAME_IMAGE_${{ entry.key }}: ${{ entry.value.distro }} ${{ entry.value.version }}

          # Internal stage: images are pushed to the internal registry for validation.
          # isPublic is left at false so the build is not tagged and signing is not triggered,
          # even when this is a real (non-dryrun) run.
          #
          # The matrix is expanded here rather than inside build-images.yml because passing the
          # object through a `type: object` template parameter re-parses its scalars, which
          # renders a tag such as '3.0' as "3".
          - ${{ each entry in parameters.jobs }}:
              - template: /.devops/templates/build-images.yml@self
                parameters:
                  jobPrefix: build_internal
                  jobKey: ${{ entry.key }}
                  registry: $(INTERNAL_ACR_REGISTRY)
                  organization: ${{ parameters.organization }}
                  feed: ${{ parameters.feed }}
                  az_package: ${{ parameters.az_package }}
                  dryrun: ${{ parameters.dryrun }}
                  distro: ${{ entry.value.distro }}
                  version: ${{ entry.value.version }}
                  package: ${{ entry.value.package }}
                  ${{ if entry.value.hasExistingImages }}:
                    hasExistingImages: ${{ entry.value.hasExistingImages }}
                  ${{ if entry.value.image }}:
                    image: ${{ entry.value.image }}
                  ${{ if entry.value.image_tag }}:
                    image_tag: ${{ entry.value.image_tag }}
                  ${{ if entry.value.installer_image }}:
                    installer_image: ${{ entry.value.installer_image }}
                  ${{ if entry.value.installer_tag }}:
                    installer_tag: ${{ entry.value.installer_tag }}
                  ${{ if entry.value.base_image }}:
                    base_image: ${{ entry.value.base_image }}
                  ${{ if entry.value.base_tag }}:
                    base_tag: ${{ entry.value.base_tag }}

      - stage: validate_and_publish
        displayName: "Validate & Publish"
        dependsOn: build_internal
        jobs:

          - job: wait_for_validation
            displayName: wait for validation
            pool: server
            steps:
              - task: ManualValidation@0
                timeoutInMinutes: 4320 # Three days
                inputs:
                  instructions: "please validate the build configuration, artifacts, tests, and resume"
                  onTimeout: "resume"

          # Public stage: once validation is approved the images are rebuilt and pushed to the
          # public registry. isPublic triggers the build tag and the signing pipeline, which
          # dryrun still suppresses.
          - ${{ each entry in parameters.jobs }}:
              - template: /.devops/templates/build-images.yml@self
                parameters:
                  jobPrefix: build_public
                  jobKey: ${{ entry.key }}
                  registry: $(ACR_REGISTRY)
                  organization: ${{ parameters.organization }}
                  feed: ${{ parameters.feed }}
                  az_package: ${{ parameters.az_package }}
                  dryrun: ${{ parameters.dryrun }}
                  dependsOn: [wait_for_validation]
                  isPublic: true
                  distro: ${{ entry.value.distro }}
                  version: ${{ entry.value.version }}
                  package: ${{ entry.value.package }}
                  ${{ if entry.value.hasExistingImages }}:
                    hasExistingImages: ${{ entry.value.hasExistingImages }}
                  ${{ if entry.value.image }}:
                    image: ${{ entry.value.image }}
                  ${{ if entry.value.image_tag }}:
                    image_tag: ${{ entry.value.image_tag }}
                  ${{ if entry.value.installer_image }}:
                    installer_image: ${{ entry.value.installer_image }}
                  ${{ if entry.value.installer_tag }}:
                    installer_tag: ${{ entry.value.installer_tag }}
                  ${{ if entry.value.base_image }}:
                    base_image: ${{ entry.value.base_image }}
                  ${{ if entry.value.base_tag }}:
                    base_tag: ${{ entry.value.base_tag }}

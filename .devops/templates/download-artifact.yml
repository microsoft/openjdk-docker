parameters:
  - name: organization
    type: string
  - name: feed
    type: string
  - name: package
    type: string
  - name: version
    type: string

steps:
  - task: AzureCLI@2
    displayName: Download ${{ parameters.package }} ${{ parameters.version }}
    condition: and(succeeded(), eq(variables['hasExistingImages'], 'true'))
    inputs:
      azureSubscription: "JEG-Infrastructure"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az artifacts universal download \
          --organization "$ORGANIZATION" \
          --feed "$FEED" \
          --name "${{ parameters.package }}" \
          --version "${{ parameters.version }}" \
          --path .

        echo "[DEBUG] Listing directory for debug"
        ls -la .
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
      ORGANIZATION: ${{ parameters.organization }}
      FEED: ${{ parameters.feed }}
      PACKAGE: ${{ parameters.package }}
      VERSION: ${{ parameters.version }}

  - bash: |
      normalized_version="${{ parameters.version }}"

      if [[ "$normalized_version" =~ ^(.+)-([0-9]+)$ ]]; then
        normalized_version="${BASH_REMATCH[1]}"
      fi
  
      echo "##vso[task.setvariable variable=PACKAGE_VERSION]$normalized_version"
    displayName: Normalize package version

  - bash: tar xf "${{ parameters.package }}_$(PACKAGE_VERSION)_linux_amd64.tar.gz"
    displayName: Extract ${{ parameters.package }}
